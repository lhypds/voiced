[package]
name = "voiced"
version = "1.0.0"
edition = "2021"
description = "Types what Voiced on the iPhone hears at the computer's cursor, or runs it with Claude Code"
publish = false

[[bin]]
name = "voiced"
path = "src/main.rs"

[dependencies]
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
fastrand = "2"
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_child = "1"
socket2 = "0.5"
tao = "0.34"
tray-icon = "0.21"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSControl", "NSFontDescriptor", "NSImage", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
strip = true
lto = true
